# Render Blueprint: веб-сервис + бесплатная база PostgreSQL.
# В Render: New → Blueprint → выбрать этот репозиторий. ADMIN_SECRET спросит при создании.
services:
  - type: web
    name: bishkek-clothes-demos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: clothes-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: clothes-db
    plan: free
    region: frankfurt
